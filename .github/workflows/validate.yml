name: Division 004 Infrastructure Validation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jsonschema pytest

    - name: Run Infrastructure Integrity Check
      run: python3 scripts/verify_infrastructure.py

    - name: Run Pytest Suite
      run: pytest tests/
